# @package _global_
defaults:
  - _self_
  - override /model: simple_cnn
  - override /data: cifar10
  - override /ssl_method: pseudo_labeling
  - override /trainer: basic

# Experiment configuration
experiment:
  name: "ssl_experiment"
  tags: ["semi-supervised", "pseudo-labeling", "cifar10"]
  notes: "Semi-supervised learning experiment with pseudo-labeling"

# Training configuration
train:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 1e-4
  scheduler: "cosine"
  warmup_epochs: 5
  
# Semi-supervised learning specific
ssl:
  labeled_samples: 1000
  unlabeled_samples: 49000
  pseudo_label_threshold: 0.95
  consistency_weight: 1.0
  rampup_epochs: 10
  
# Evaluation configuration
eval:
  metrics: ["accuracy", "f1", "auroc", "auprc"]
  save_predictions: true
  save_embeddings: true
  
# Logging configuration
logging:
  level: "INFO"
  log_every_n_steps: 100
  save_checkpoints: true
  checkpoint_every_n_epochs: 10
  
# Reproducibility
seed: 42
deterministic: true
