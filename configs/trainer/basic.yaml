# @package trainer
_target_: src.train.trainer.BasicTrainer

# Training configuration
max_epochs: 50
gradient_clip_val: 1.0
accumulate_grad_batches: 1
precision: 32

# Optimization
optimizer: "adam"
learning_rate: 0.001
weight_decay: 1e-4
scheduler: "cosine"

# Callbacks
early_stopping:
  monitor: "val_loss"
  patience: 10
  mode: "min"

model_checkpoint:
  monitor: "val_accuracy"
  mode: "max"
  save_top_k: 3
